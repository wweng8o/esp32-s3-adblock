name: release

# Push a tag like v3.0.0 and the ESP32-S3 images are attached to it:
#   s3-bootloader.bin     0x0
#   s3-partitions.bin     0x8000
#   boot_app0.bin         0xe000
#   esp32s3-firmware.bin  0x10000
#   s3-littlefs.bin       0x330000   (filesystem preloaded with the weekly blocklist)
# Blocklists are published separately by blocklist.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-release-${{ hashFiles('platformio.ini') }}
      - run: pip install -U platformio intelhex
      - name: Placeholder secrets (real ones are gitignored)
        run: cp src/secrets.example.h src/secrets.h
      - run: pio run -e s3

      # A prebuilt filesystem makes the board usable without PlatformIO: drop the
      # weekly blocklist into data/ and let buildfs wrap it into a flashable image.
      - name: Fetch the current blocklist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download blocklist --pattern blocklist.bin --dir data --clobber || echo "no blocklist release yet"
      - name: Build the filesystem image
        run: pio run -e s3 -t buildfs

      - name: Collect artifacts
        run: |
          mkdir -p out
          B=".pio/build/s3"
          cp "$B/bootloader.bin"   "out/s3-bootloader.bin"
          cp "$B/partitions.bin"   "out/s3-partitions.bin"
          cp "$B/firmware.bin"     "out/esp32s3-firmware.bin"
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
             "out/boot_app0.bin"
          if [ -f "$B/littlefs.bin" ] && [ -f data/blocklist.bin ]; then
            cp "$B/littlefs.bin" "out/s3-littlefs.bin"
          else
            echo "no blocklist in data/ -> skipping s3-littlefs.bin"
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: s3
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach images to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # no checkout in this job: tell gh the repo
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" out/* --clobber
