name: release

# Push a tag like v2.0.0 and the ESP32-S3 firmware images are attached to it.
# Blocklists are published separately by blocklist.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-release-${{ hashFiles('platformio.ini') }}
      - run: pip install -U platformio intelhex
      - name: Placeholder secrets (real ones are gitignored)
        run: cp src/secrets.example.h src/secrets.h
      - run: pio run -e s3
      - name: Collect artifacts
        run: |
          mkdir -p out
          B=".pio/build/s3"
          cp "$B/firmware.bin"   "out/esp32s3-n16r8-firmware.bin"
          cp "$B/bootloader.bin" "out/s3-bootloader.bin"
          cp "$B/partitions.bin" "out/s3-partitions.bin"
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
             "out/boot_app0.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: s3
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach firmware to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # no checkout in this job: tell gh the repo
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" out/* --clobber
