name: release

# Pushes a tag like v2.0.0 and gets firmware images attached to the release.
# Blocklists are published separately by blocklist.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: s3
            asset: esp32s3-n16r8-firmware.bin
          - env: c3
            asset: esp32c3-firmware.bin
          - env: esp32dev
            asset: esp32-firmware.bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-release-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install -U platformio intelhex
      - name: Placeholder secrets (real ones are gitignored and never built here)
        run: cp src/secrets.example.h src/secrets.h
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      - name: Collect artifacts
        run: |
          mkdir -p out
          B=".pio/build/${{ matrix.env }}"
          cp "$B/firmware.bin"     "out/${{ matrix.asset }}"
          cp "$B/bootloader.bin"   "out/${{ matrix.env }}-bootloader.bin"
          cp "$B/partitions.bin"   "out/${{ matrix.env }}-partitions.bin"
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
             "out/boot_app0.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach firmware to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" out/* --clobber
