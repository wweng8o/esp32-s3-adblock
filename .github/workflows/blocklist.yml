name: blocklist

# Rebuilds the default ('max') blocklist weekly and publishes it at a stable URL:
#   https://github.com/wweng8o/esp32-s3-adblock/releases/download/blocklist/blocklist.bin
# Point a device's "Remote auto-update" at that URL and it stays current on its own.
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build default blocklist (fails if any source is unreachable)
        run: python3 tools/build_blocklist.py blocklist.bin 2>&1 | tee build.log
      - name: Sanity checks
        run: |
          size=$(stat -c%s blocklist.bin)
          echo "size=$size bytes"
          test $((size % 5)) -eq 0                  # whole 40-bit entries
          test "$size" -gt 9000000                  # >1.8M entries, catches a silently shrunk list
          test "$size" -lt 12000000                 # fits the 12.8 MB filesystem partition
      - name: Publish to the 'blocklist' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          entries=$(( $(stat -c%s blocklist.bin) / 5 ))
          notes="Auto-built $(date -u +%F) - ${entries} entries (StevenBlack + Hagezi ultimate + OISD big + Hagezi TIF, 'max' preset).

          Set this as the device's Remote auto-update URL:
          https://github.com/${{ github.repository }}/releases/download/blocklist/blocklist.bin"
          if gh release view blocklist >/dev/null 2>&1; then
            gh release edit blocklist --notes "$notes"
          else
            gh release create blocklist --title "Weekly blocklist" --notes "$notes" --latest=false
          fi
          gh release upload blocklist blocklist.bin --clobber
