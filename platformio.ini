[platformio]
default_envs = s3

; ESP32-S3 N16R8 only: 16 MB flash + 8 MB octal PSRAM.
;   - partitions.csv gives two 1.5625 MB OTA slots and a 12.5 MB blocklist
;     filesystem (~2.6M hashed domains)
;   - the blocklist is mirrored into PSRAM when it fits, so lookups become
;     in-RAM binary searches; larger lists use the flash index instead
[env]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi      ; octal PSRAM sdkconfig
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
; Serial stays on UART0, which is what a CH340/CP210x USB-serial bridge needs.
; Boards wired to the S3's native USB port should add:
;   -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:s3]
; defaults above

; Same firmware, flashed over WiFi with ArduinoOTA:
;   $env:OTA_PASS="<OTA_PASS from secrets.h>"
;   pio run -e s3-ota -t upload --upload-port s3adblock.local
[env:s3-ota]
extends = env:s3
upload_protocol = espota
upload_port = s3adblock.local
upload_flags =
    --port=3232
    --auth=${sysenv.OTA_PASS}
