[platformio]
default_envs = s3

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev
board_build.partitions = partitions.csv

; ESP32-C3 SuperMini: 4 MB flash, no PSRAM. All 5-byte domain hashes stay in
; flash and are found through a 4096-entry first-level index.
[env:c3]
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 (default): dual-core 240 MHz + PSRAM. At boot the blocklist is
; mirrored into PSRAM when it fits, so lookups become in-RAM binary searches
; (~microseconds) instead of ~18 flash reads.
;
; Defaults target N16R8 (16 MB flash + 8 MB octal PSRAM):
;   - 16 MB partition table -> 12.5 MB LittleFS (~2.6M domains)
;   - lists larger than free PSRAM skip the mirror and use the flash path
; For an 8 MB module (N8R8) switch these two lines back:
;   board_build.partitions = partitions_s3.csv
;   board_upload.flash_size = 8MB
; For quad PSRAM (N8R2) also set board_build.arduino.memory_type = qio_qspi.
[env:s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_s3_16mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; This board uses a CH340/CP210x USB-UART bridge, so keep Serial on UART0.
; If your S3 is wired to its native USB port instead, add:
;   -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
